name: Build MRI film sheet desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - "build/windows-film-sheet-*"
    tags:
      - "film-sheet-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ startsWith(github.ref, 'refs/heads/build/windows-film-sheet-') && fromJSON('["windows-latest"]') || fromJSON('["windows-latest","macos-latest","macos-15-intel","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the app and build dependencies
        run: python -m pip install ".[film-sheet,standalone,test]"
      - name: Verify PDF and imaging dependencies are active
        run: python -c "import nibabel, numpy, pydicom, pypdf, reportlab, tkinter; print('PDF, imaging, and Tk dependencies ready')"
      - name: Run synthetic DICOM/NIfTI and PDF checks
        run: python -m unittest neuroflow.tests.test_film_sheet -v
      - name: Build the desktop app
        run: python code/packaging/build_film_sheet.py
      - name: Smoke test packaged PDF engine on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $resultFile = Join-Path $env:RUNNER_TEMP "neuroflow-film-sheet-engine-smoke.txt"
          Remove-Item $resultFile -ErrorAction SilentlyContinue
          & "dist/film_sheet/NeuroFlowMRIFilmSheet/NeuroFlowMRIFilmSheet.exe" --engine-smoke-test --result-file $resultFile
          $exitCode = $LASTEXITCODE
          if (Test-Path -PathType Leaf $resultFile) { Get-Content $resultFile }
          if ($exitCode -ne 0) { throw "Packaged PDF engine smoke test failed with exit code $exitCode." }
          if (-not (Test-Path -PathType Leaf $resultFile)) { throw "Packaged PDF engine smoke test did not complete." }
      - name: Smoke test packaged PDF engine on macOS and Linux
        if: runner.os != 'Windows'
        run: |
          result_file="$RUNNER_TEMP/neuroflow-film-sheet-engine-smoke.txt"
          rm -f "$result_file"
          if [ "$RUNNER_OS" = "macOS" ]; then
            executable="dist/film_sheet/NeuroFlowMRIFilmSheet.app/Contents/MacOS/NeuroFlowMRIFilmSheet"
          else
            executable="dist/film_sheet/NeuroFlowMRIFilmSheet/NeuroFlowMRIFilmSheet"
          fi
          "$executable" --engine-smoke-test --result-file "$result_file"
          test -s "$result_file"
          cat "$result_file"
      - name: Install virtual display for Linux GUI smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Smoke test Windows desktop app and PDF output
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "dist/film_sheet/NeuroFlowMRIFilmSheet/NeuroFlowMRIFilmSheet.exe" --smoke-test'
      - name: Smoke test macOS desktop app and PDF output
        if: runner.os == 'macOS'
        run: |
          result_file="$RUNNER_TEMP/neuroflow-film-sheet-smoke.txt"
          rm -f "$result_file"
          open -n -W dist/film_sheet/NeuroFlowMRIFilmSheet.app --args --smoke-test --result-file "$result_file"
          test -s "$result_file"
          cat "$result_file"
      - name: Smoke test Linux desktop app and PDF output
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/film_sheet/NeuroFlowMRIFilmSheet/NeuroFlowMRIFilmSheet --smoke-test
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg-root
          cp -R dist/film_sheet/NeuroFlowMRIFilmSheet.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "NeuroFlow MRI Film Sheet" -srcfolder dmg-root -ov -format UDZO NeuroFlowMRIFilmSheet-macOS-${{ runner.arch }}.dmg
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" code/packaging/windows/NeuroFlowMRIFilmSheet.iss'
      - name: Package Linux application archive
        if: runner.os == 'Linux'
        run: tar -czf NeuroFlowMRIFilmSheet-Linux-${{ runner.arch }}.tar.gz -C dist/film_sheet NeuroFlowMRIFilmSheet
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroFlowMRIFilmSheet-${{ runner.os }}-${{ runner.arch }}
          path: |
            NeuroFlowMRIFilmSheet-*.exe
            NeuroFlowMRIFilmSheet-*.dmg
            NeuroFlowMRIFilmSheet-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/film-sheet-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NeuroFlowMRIFilmSheet-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
