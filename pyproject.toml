[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroflow"
version = "0.4.15"
description = "Local web and CLI controller for multimodal BIDS processing"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "pydicom>=3,<4",
]

[project.optional-dependencies]
pipeline = [
  "numpy>=1.23,<3",
  "nibabel>=5,<6",
  "scipy>=1.10,<2",
]
test = [
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "numpy>=1.23,<3",
  "nibabel>=5,<6",
  "scipy>=1.10,<2",
  "Pillow>=10,<14",
  "reportlab>=4,<6",
]
standalone = ["pyinstaller>=6.10,<8"]
film-sheet = [
  "numpy>=1.23,<3",
  "nibabel>=5,<6",
  "scipy>=1.10,<2",
  "Pillow>=10,<14",
  "reportlab>=4,<6",
]

[project.scripts]
neuroflow = "neuroflow.cli:main"
prisma-workbench = "neuroflow.cli:main"
neuroflow-dicom-sorter = "neuroflow.standalone_gui:main"
neuroflow-film-sheet = "neuroflow.film_sheet_gui:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
include = ["neuroflow*"]

[tool.setuptools.package-data]
neuroflow = ["templates/*.html", "static/*.css", "data/*.json"]
